services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - .:/app
      - composer_cache:/tmp/composer-cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      APP_ENV: local
      APP_DEBUG: "true"
    command: sh -lc "php artisan serve --host=0.0.0.0 --port=8088"
    ports:
      - "8088:8088"

volumes:
  composer_cache:
